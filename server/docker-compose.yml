# Potion Siege's telemetry collector on the box daydayup ("blightbloom") owns, next to Holy
# Kicker and fight and apart from all of them: its own compose project in
# /home/deploy/potion-siege, its own network. The box's ports 80/443 are daydayup's Caddy, so
# this publishes none; `tunnel` (cloudflared) dials out to Cloudflare, which serves
# https://ps.gamestao.com and sends its requests down that connection to `collector`.
# Same shape as D:\standing's server/deploy.
name: potion-siege

services:
  collector:
    build: .
    image: potion-siege-collector
    container_name: ps-collector
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      # one NDJSON file per UTC day (deploy user = uid 1000 = the image's `node`)
      - ./data:/data
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # A remotely managed tunnel: its route (ps.gamestao.com -> http://collector:8787) is set on
  # Cloudflare's side; the token in .env is all it needs here.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    container_name: ps-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${PS_TUNNEL_TOKEN:?PS_TUNNEL_TOKEN missing from .env}
    depends_on:
      collector:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging
