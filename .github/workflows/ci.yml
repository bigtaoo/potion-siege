name: ci

# Every push and pull request runs `npm run check` (typecheck, file length, tests, the quick half of the
# balance guard in scripts/guard/, the CrazyGames and iOS builds), then the slow half of the guard
# (`npm run check:balance:slow`: the early, chapter and boss curves; scripts/vitest.guard.config.js). A
# push to main that passes then ships the telemetry collector to blightbloom (ps.gamestao.com,
# server/) and, after it, publishes the web build to Cloudflare at p.gamestao.com
# (wrangler/web.jsonc). Same shape as D:\standing's ci.yml. A push that leaves the collector
# unchanged restarts nothing (server/ci-deploy.sh compares it). The CrazyGames zip is
# built too and kept as a run artifact, for uploading on the developer portal by hand. Both
# deploys check that their commit is still main's tip first: a run that finishes after a newer
# push's never puts the older build back.
#
# The deploys need, in Settings -> Secrets and variables -> Actions:
#   Secrets    CLOUDFLARE_API_TOKEN   gamestao.com account, at least Workers Scripts:Edit
#              CLOUDFLARE_ACCOUNT_ID
#              SERVER_DEPLOY_KEY      ssh key that can only run ci-deploy.sh on the box
#                                     (local copy D:\cloud\potion_siege_ci_ed25519; server/README.md)
#   Variables  WEB_DEPLOY_ENABLED = true, SERVER_DEPLOY_ENABLED = true   (unset: that deploy
#                                     is skipped, so CI stays green before the secrets are in)
#              SERVER_SSH_KNOWN_HOSTS   the box's pinned host key line
#
# Both builds send telemetry to https://ps.gamestao.com/e (.env.production).
#
# Beside `check`, `smoke` builds the web, CrazyGames and iOS dists and plays each for 30 s in
# headless Chrome (scripts/smoke.mjs, the runner's own Chrome): a page error, a console error, a
# failed request or no fight fails it, and no deploy runs without it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# a newer push cancels an older run, except on main, where a deploy may be halfway through
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: balance guard, slow half
        run: npm run check:balance:slow
      - name: zip the CrazyGames build
        run: cd dist-crazygames && zip -qr ../potion-siege-crazygames.zip .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: potion-siege-crazygames
          path: potion-siege-crazygames.zip
          retention-days: 30

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: build the release dists
        # side by side and without tsc, which `check` runs
        run: |
          set -eu
          pids=""
          for c in vite.config.js vite.crazygames.config.js vite.ios.config.js; do
            npx vite build --config "$c" --logLevel warn > "/tmp/$c.log" 2>&1 & pids="$pids $!"
          done
          for p in $pids; do wait "$p" || { cat /tmp/*.log; exit 1; }; done
      # the runner's own Google Chrome (playwright-core downloads none)
      - run: npm run smoke

  deploy-server:
    needs: [check, smoke]
    runs-on: ubuntu-latest
    if: ${{ vars.SERVER_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: server-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: still main's tip?
        id: tip
        run: |
          set -eu
          git fetch -q --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then echo "go=1" >> "$GITHUB_OUTPUT"
          else echo "main has moved on from $GITHUB_SHA; its own run deploys" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: deploy over ssh
        if: steps.tip.outputs.go == '1'
        env:
          DEPLOY_KEY: ${{ secrets.SERVER_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # pinned, never StrictHostKeyChecking=no: the key and payload go only to this box
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # the forced command on the box reads this tar.gz from stdin and takes the collector's three
          # files alone; the Dockerfile and compose file stay as installed by hand there (server/ci-deploy.sh)
          tar czf - -C scripts collector.mjs collectorLimits.mjs replayShelf.mjs |
            ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes deploy@62.238.1.182
      - name: verify from the outside
        if: steps.tip.outputs.go == '1'
        run: |
          set -eu
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 https://ps.gamestao.com/health; then echo; exit 0; fi
            sleep 3
          done
          echo "ps.gamestao.com/health did not answer" >&2
          exit 1

  deploy-web:
    needs: [check, smoke, deploy-server]
    runs-on: ubuntu-latest
    # runs when the server deploy succeeded or was switched off, never after it failed
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.smoke.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.deploy-server.result) && vars.WEB_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: web-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: build web
        run: npm run build
      # checked last thing before the deploy: main may move while this builds
      - name: still main's tip?
        id: tip
        run: |
          set -eu
          git fetch -q --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then echo "go=1" >> "$GITHUB_OUTPUT"
          else echo "main has moved on from $GITHUB_SHA; its own run deploys" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: deploy to Cloudflare
        if: steps.tip.outputs.go == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.118.0 deploy -c wrangler/web.jsonc
      - name: verify from the outside
        if: steps.tip.outputs.go == '1'
        run: |
          set -eu
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 -o /dev/null https://p.gamestao.com/; then exit 0; fi
            sleep 3
          done
          echo "p.gamestao.com did not answer" >&2
          exit 1
